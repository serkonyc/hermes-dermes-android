<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;background:#151515}</style></head><body>
<script src="/web/lib/three.min.js"></script>
<script src="/web/lib/GLTFLoader.js"></script>
<script src="/web/models/enemies.glb.js"></script>
<script>
const rend=new THREE.WebGLRenderer({antialias:true});
rend.setSize(640,800);document.body.appendChild(rend.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x151515);
const cam=new THREE.PerspectiveCamera(35,640/800,.01,50);
scene.add(new THREE.AmbientLight(0xffffff,.6));
const dl=new THREE.DirectionalLight(0xffffff,1.0);dl.position.set(1,2,1.5);scene.add(dl);
const dl2=new THREE.DirectionalLight(0x8899ff,.35);dl2.position.set(-1,.5,-1);scene.add(dl2);
const loader=new THREE.GLTFLoader();
const buf=Uint8Array.from(atob(window.ENEMIES_GLB_B64),c=>c.charCodeAt(0));
window.SHOT=async function(name,pos,look){
  return new Promise(res=>{
    scene.traverse(o=>{if(o.userData.enemy)o.visible=(o.name===name);});
    cam.position.set(...pos);cam.lookAt(...look);cam.updateMatrixWorld(true);
    rend.render(scene,cam);
    fetch('http://127.0.0.1:8899/',{method:'POST',body:rend.domElement.toDataURL('image/png')}).then(r=>r.text()).then(res);
  });
};
loader.parse(buf.buffer,'',gltf=>{
  gltf.scene.traverse(o=>{o.userData.enemy=true;});
  scene.add(gltf.scene);
  window.ENEMY_OK=gltf.scene.children.map(c=>c.name+':'+(function(o){let t=0;o.traverse(m=>{if(m.isMesh)t+=m.geometry.attributes.position.count/3});return Math.round(t);})());
  window.ENEMY_LOADED=true;
},e=>{window.ENEMY_OK='ERR '+e.message;window.ENEMY_LOADED=true;});
</script></body></html>
