<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Лесной Ран</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#4FB8F5;overflow:hidden;touch-action:none;
    font-family:-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-user-select:none;user-select:none}
  #c{position:fixed;inset:0;display:block;width:100%;height:100%}
  #hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:14px;right:14px;
    display:none;justify-content:space-between;align-items:baseline;pointer-events:none}
  .badge{background:rgba(255,255,255,.92);border-radius:14px;padding:6px 12px;
    box-shadow:0 3px 0 rgba(0,0,0,.15);font:800 15px system-ui}
  #score{color:#FF8C42}#coins{color:#E0A400}#best{color:#4D96FF;font-size:13px}
  #meta{position:fixed;top:calc(env(safe-area-inset-top,0px) + 54px);right:14px;color:rgba(255,255,255,.95);
    font:700 12px system-ui;text-shadow:0 1px 2px rgba(0,0,0,.3);display:none;pointer-events:none}
  .ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(79,184,245,.35);text-align:center;pointer-events:none}
  .ov h1{margin:0;font-size:38px;font-weight:900;letter-spacing:.02em;color:#fff;
    text-shadow:0 3px 0 #E5651B,0 6px 14px rgba(0,0,0,.25)}
  .ov p{margin:24px 0 0;color:#fff;font-size:14px;font-weight:600;line-height:1.9;text-shadow:0 1px 2px rgba(0,0,0,.35)}
  .ov .card{margin-top:18px;background:rgba(255,255,255,.94);border-radius:18px;padding:14px 26px;
    box-shadow:0 4px 0 rgba(0,0,0,.15)}
  .ov .big{font:900 20px system-ui;color:#333}
  .ov .go{margin-top:30px;color:#fff;font:800 14px system-ui;letter-spacing:.1em;
    text-shadow:0 2px 4px rgba(0,0,0,.35);animation:pulse 1.6s ease-in-out infinite}
  #over h1{text-shadow:0 3px 0 #B03A2E,0 6px 14px rgba(0,0,0,.25)}
  @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
  #flash{position:fixed;inset:0;background:#E63946;opacity:0;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div id="ver" style="position:fixed;right:8px;bottom:6px;color:rgba(0,0,0,.35);font:700 11px system-ui;z-index:5"></div>
  <span class="badge" id="score">000000</span>
  <span class="badge" id="coins">⚔ 0</span>
  <span class="badge" id="best">000000</span>
</div>
<div id="meta">0 м · 0 км/ч</div>
<div class="ov" id="menu">
  <h1>ЛЕСНОЙ РАН</h1>
  <p>свайп: ↑ прыжок · ↓ подкат · ← → полоса<br>собирай мечи ⚔<br><span id="mbest"></span></p>
  <div class="go">НАЖМИ, ЧТОБЫ НАЧАТЬ</div>
</div>
<div id="again" style="position:fixed;left:50%;top:18%;transform:translateX(-50%);display:none;background:#B03A2E;color:#fff;font:900 22px system-ui;padding:12px 22px;border-radius:14px;box-shadow:0 4px 0 rgba(0,0,0,.25);pointer-events:none;z-index:9">ЗАБЕГ ОКОНЧЕН · НАЖМИ, ЧТОБЫ ПРОБЕЖАТЬ ЗАНОВО</div>
<div class="ov" id="over">
  <h1 id="oh1">ПОЙМАЛИ!</h1>
  <div class="card" id="ocard"><div class="big" id="ostats"></div>
  <p style="margin:8px 0 0;color:#888;font-size:13px" id="obest"></p></div>
  <div class="card" id="mathq" style="display:none;font:900 30px system-ui;color:#333"></div>
  <div id="mathrow" style="display:none;margin-top:14px;gap:10px;align-items:center;pointer-events:auto;touch-action:auto;-webkit-user-select:text;user-select:text">
    <input id="mathn" type="text" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done" style="width:110px;font:900 24px system-ui;text-align:center;border:0;border-radius:12px;padding:8px 10px;box-shadow:0 4px 0 rgba(0,0,0,.15)">
    <button id="mathok" style="font:800 18px system-ui;border:0;border-radius:12px;padding:10px 18px;background:#FF8C42;color:#fff;box-shadow:0 4px 0 #E5651B">✓</button>
  </div>
  <div id="matherr" style="visibility:hidden;margin-top:10px;color:#fff;font:800 14px system-ui;text-shadow:0 2px 4px rgba(0,0,0,.35)">НЕ ВЕРНО, ПОПРОБУЙ ЕЩЁ</div>
  <div class="go" id="ogo" style="visibility:hidden">НАЖМИ, ЧТОБЫ ПОВТОРИТЬ</div>
</div>
<div id="flash"></div>
<script src="lib/three.min.js"></script>
<script src="lib/GLTFLoader.js"></script>
<script src="models/link.glb.js"></script>
<script src="models/enemies.glb.js"></script>
<script src="game.js"></script>
</body>
</html>
